{{- $ns := include "drm.namespace" . -}}
{{- $domain := include "drm.domain" . -}}
# ============================================================================
# Certificate Authority Deployments, Services, Ingresses (org0, org1, org2)
# ============================================================================
{{- range $org := list "org0" "org1" "org2" }}
{{- $pvc := printf "fabric-%s" $org }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $org }}-ca
  namespace: {{ $ns }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $org }}-ca
  template:
    metadata:
      labels:
        app: {{ $org }}-ca
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: main
          image: {{ $.Values.images.fabricCA.repository }}:{{ $.Values.images.fabricCA.tag }}
          imagePullPolicy: {{ $.Values.images.fabricCA.pullPolicy }}
          env:
            - name: FABRIC_CA_SERVER_CA_NAME
              value: "{{ $org }}-ca"
            - name: FABRIC_CA_SERVER_DEBUG
              value: "false"
            - name: FABRIC_CA_SERVER_HOME
              value: "/var/hyperledger/fabric-ca-server"
            - name: FABRIC_CA_SERVER_TLS_CERTFILE
              value: "/var/hyperledger/fabric/config/tls/tls.crt"
            - name: FABRIC_CA_SERVER_TLS_KEYFILE
              value: "/var/hyperledger/fabric/config/tls/tls.key"
            - name: FABRIC_CA_CLIENT_HOME
              value: "/var/hyperledger/fabric-ca-client"
          ports:
            - containerPort: 443
          volumeMounts:
            - name: fabric-volume
              mountPath: /var/hyperledger
            - name: fabric-config
              mountPath: /var/hyperledger/fabric-ca-server/fabric-ca-server-config.yaml
              subPath: fabric-ca-server-config.yaml
            - name: tls-cert-volume
              mountPath: /var/hyperledger/fabric/config/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: fabric-volume
          persistentVolumeClaim:
            claimName: {{ $pvc }}
        - name: fabric-config
          configMap:
            name: {{ $org }}-config
        - name: tls-cert-volume
          secret:
            secretName: {{ $org }}-ca-tls-cert

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $org }}-ca
  namespace: {{ $ns }}
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
  selector:
    app: {{ $org }}-ca

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: 60s
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
  labels:
    app: {{ $org }}-ca
  name: {{ $org }}-ca
  namespace: {{ $ns }}
spec:
  {{- include "drm.ingressClass" $ | nindent 2 }}
  rules:
    - host: {{ $org }}-ca.{{ $domain }}
      http:
        paths:
          - backend:
              service:
                name: {{ $org }}-ca
                port:
                  name: https
            path: /
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - {{ $org }}-ca.{{ $domain }}
{{- end }}
