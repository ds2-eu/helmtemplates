{{- $ns := include "drm.namespace" . -}}
{{- $domain := include "drm.domain" . -}}
# ============================================================================
# Org0 Config (CA server config + orderer.yaml)
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: org0-config
  namespace: {{ $ns }}
data:
  fabric-ca-server-config.yaml: |
    version: 1.5.2
    port: 443
    cors:
      enabled: false
      origins:
        - "*"
    debug: false
    crlsizelimit: 512000
    tls:
      enabled: true
      certfile:
      keyfile:
      clientauth:
        type: noclientcert
        certfiles:
    ca:
      name: org0-ca
      keyfile:
      certfile:
      chainfile:
    crl:
      expiry: 24h
    registry:
      maxenrollments: -1
      identities:
        - name: {{ .Values.caAdmin.user }}
          pass: {{ .Values.caAdmin.password }}
          type: client
          affiliation: ""
          attrs:
            hf.Registrar.Roles: "*"
            hf.Registrar.DelegateRoles: "*"
            hf.Revoker: true
            hf.IntermediateCA: true
            hf.GenCRL: true
            hf.Registrar.Attributes: "*"
            hf.AffiliationMgr: true
    db:
      type: sqlite3
      datasource: fabric-ca-server.db
      tls:
        enabled: false
        certfiles:
        client:
          certfile:
          keyfile:
    ldap:
      enabled: false
      url: ldap://<adminDN>:<adminPassword>@<host>:<port>/<base>
      tls:
        certfiles:
        client:
          certfile:
          keyfile:
      attribute:
        names: ['uid','member']
        converters:
          - name:
            value:
        maps:
          groups:
            - name:
              value:
    affiliations:
      org1:
        - department1
        - department2
      org2:
        - department1
    signing:
      default:
        usage:
          - digital signature
        expiry: 8760h
      profiles:
        ca:
          usage:
            - cert sign
            - crl sign
          expiry: 43800h
          caconstraint:
            isca: true
            maxpathlen: 0
        tls:
          usage:
            - signing
            - key encipherment
            - server auth
            - client auth
            - key agreement
          expiry: 8760h
    csr:
      cn: fabric-ca-server
      keyrequest:
        algo: ecdsa
        size: 256
      names:
        - C: US
          ST: "North Carolina"
          L:
          O: Hyperledger
          OU: Fabric
      hosts:
        - localhost
        - 127.0.0.1
        - org0-ca
        - org0-ca.{{ $ns }}.svc.cluster.local
      ca:
        expiry: 131400h
        pathlength: 1
    idemix:
      rhpoolsize: 1000
      nonceexpiration: 15s
      noncesweepinterval: 15m
    bccsp:
      default: SW
      sw:
        hash: SHA2
        security: 256
        filekeystore:
          keystore: msp/keystore
    cacount:
    cafiles:
    intermediate:
      parentserver:
        url:
        caname:
      enrollment:
        hosts:
        profile:
        label:
      tls:
        certfiles:
        client:
          certfile:
          keyfile:
    cfg:
      identities:
        passwordattempts: 10
    operations:
      listenAddress: 127.0.0.1:9443
      tls:
        enabled: false
        cert:
          file:
        key:
          file:
        clientAuthRequired: false
        clientRootCAs:
          files: []
    metrics:
      provider: disabled
      statsd:
        network: udp
        address: 127.0.0.1:8125
        writeInterval: 10s
        prefix: server
  orderer.yaml: |
    General:
      ListenAddress: 0.0.0.0
      ListenPort: 6050
      TLS:
        Enabled: false
        PrivateKey: tls/server.key
        Certificate: tls/server.crt
        RootCAs:
          - tls/ca.crt
        ClientAuthRequired: false
        ClientRootCAs:
      Keepalive:
        ServerMinInterval: 60s
        ServerInterval: 7200s
        ServerTimeout: 20s
      Cluster:
        SendBufferSize: 10
        ClientCertificate:
        ClientPrivateKey:
        ListenPort:
        ListenAddress:
        ServerCertificate:
        ServerPrivateKey:
      BootstrapMethod: none
      BootstrapFile:
      LocalMSPDir: msp
      LocalMSPID: SampleOrg
      Profile:
        Enabled: false
        Address: 0.0.0.0:6060
      BCCSP:
        Default: SW
        SW:
          Hash: SHA2
          Security: 256
          FileKeyStore:
            KeyStore:
        PKCS11:
          Library:
          Label:
          Pin:
          Hash:
          Security:
          FileKeyStore:
            KeyStore:
      Authentication:
        TimeWindow: 15m
    FileLedger:
      Location: /var/hyperledger/production/orderer
    Kafka:
      Retry:
        ShortInterval: 5s
        ShortTotal: 10m
        LongInterval: 5m
        LongTotal: 12h
        NetworkTimeouts:
          DialTimeout: 10s
          ReadTimeout: 10s
          WriteTimeout: 10s
        Metadata:
          RetryBackoff: 250ms
          RetryMax: 3
        Producer:
          RetryBackoff: 100ms
          RetryMax: 3
        Consumer:
          RetryBackoff: 2s
      Topic:
        ReplicationFactor: 3
      Verbose: false
      TLS:
        Enabled: false
        PrivateKey:
        Certificate:
        RootCAs:
      SASLPlain:
        Enabled: false
        User:
        Password:
      Version:
    Debug:
      BroadcastTraceDir:
      DeliverTraceDir:
    Operations:
      ListenAddress: 0.0.0.0:8443
      TLS:
        Enabled: false
        Certificate:
        PrivateKey:
        ClientAuthRequired: false
        ClientRootCAs: []
    Metrics:
      Provider: disabled
      Statsd:
        Network: udp
        Address: 127.0.0.1:8125
        WriteInterval: 30s
        Prefix:
    Admin:
      ListenAddress: 0.0.0.0:9443
      TLS:
        Enabled: false
        Certificate:
        PrivateKey:
        ClientAuthRequired: true
        ClientRootCAs: []
    ChannelParticipation:
      Enabled: true
      MaxRequestBodySize: 1 MB
    Consensus:
      WALDir: /var/hyperledger/production/orderer/etcdraft/wal
      SnapDir: /var/hyperledger/production/orderer/etcdraft/snapshot

