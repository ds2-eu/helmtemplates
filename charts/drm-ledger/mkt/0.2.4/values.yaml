# DRM Ledger Helm Chart - Configuration Values

# Module name. Used to build the Marketplace image path and the pull secret name:
#   <registryUrl>/ds2-eu/mkt-<module.name>/<image.name>:<image.tag>
module:
  name: drm

# The ingress domain is NOT configured here - it is read at install time from
# ConfigMap icekube/idtconfigmap (key: domain), the same source the DS2 base
# charts use, so every module shares the organisation domain.

# Fabric CA bootstrap admin credentials
caAdmin:
  user: rcaadmin
  password: rcaadminpw

# Channel configuration
channel:
  name: mychannel

# CouchDB credentials (sidecar in peer pods)
couchdb:
  image:
    name: drm-couchdb
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  user: admin
  password: adminpw

# Chaincode configuration
chaincode:
  image:
    name: drm-chaincode
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  name: asset-transfer-basic
  label: asset-transfer-basic
  version: "1"
  sequence: "1"

# REST API configuration
restApi:
  image:
    name: drm-rest-api
    tag: "1.0.0"
    pullPolicy: Always
  org1ApiKey: "97834158-3224-4CE7-95F9-A148C886653E"
  org2ApiKey: "BC42E734-062D-4AEE-A591-5973CB763430"
  logLevel: debug
  port: "3000"
  commitTimeout: "300"
  endorseTimeout: "30"
  queryTimeout: "3"

# Container images.
# Each component carries its own image block (<component>.image.name/tag) so the
# DS2 Marketplace can detect it. Components that also have other settings
# (couchdb, chaincode, restApi, drmUi*, drmLedgerExtractor, drmConnectorMonitoring)
# keep their image block inside their existing section below.
# The registry URL is read at install time from ConfigMap icekube/idtconfigmap
# (key: registryUrl) - the full path is built by the drm.imageURL helper as
#   <registryUrl>/ds2-eu/mkt-<module.name>/<image.name>:<image.tag>

# Fabric CA
fabricCA:
  image:
    name: drm-fabric-ca
    tag: "1.0.0"
    pullPolicy: Always

# Fabric orderer
fabricOrderer:
  image:
    name: drm-fabric-orderer
    tag: "1.0.0"
    pullPolicy: Always

# Fabric peer
fabricPeer:
  image:
    name: drm-fabric-peer
    tag: "1.0.0"
    pullPolicy: Always

# Fabric tools (bootstrap-channel hook)
fabricTools:
  image:
    name: drm-fabric-tools
    tag: "1.0.0"
    pullPolicy: Always

# Redis (sidecar in the REST API pod)
redis:
  image:
    name: drm-redis
    tag: "1.0.0"
    pullPolicy: Always

# Busybox (init containers in orderer and peer pods)
busybox:
  image:
    name: drm-busybox
    tag: "1.0.0"
    pullPolicy: Always

# kubectl (install hooks)
kubectl:
  image:
    name: drm-kubectl
    tag: "1.0.0"
    pullPolicy: Always

# Private registry. Credentials are read at install time from Secret
# icekube/idtsecret (keys: username, token) and turned into a single
# dockerconfigjson secret shared by every component in the chart.
image:
  privateRegistry:
    # Create the pull secret and reference it from every pod
    enabled: true
    # Set to true when a global pull secret with the same name is already
    # provided in the namespace - the chart will reference it without creating it
    global: false

# Persistence. The chart ships a PersistentVolume + PersistentVolumeClaim pair
# per organisation, bound to each other through a release-specific storage class,
# so no dynamically provisioned storage class is required in the cluster.
persistence:
  enabled: true
  storage: 1Gi
  accessmode: ReadWriteOnce
  reclaimpolicy: Delete
  # Host path base directory - one sub-directory per organisation is created
  path: /idt/drm

# DRM UI Backend (ilab-ds2-drm-ui-backend)
drmUiBackend:
  image:
    name: drm-ui-be
    tag: "1.0.0"
    pullPolicy: Always
  logLevel: debug
  # Ledger reads now go through the extractor rather than the REST API directly
  ledgerExtractor: "http://drm-ledger-extractor:3002"
  readByIdPath: "/ledger/readByID"
  readAllPath: "/ledger/readAll"
  enrollPath: "/enroll"
  verifyPath: "/enroll/verify"
  enrollAdminPath: "/enroll/enrollAdmin"

# DRM Ledger Extractor
drmLedgerExtractor:
  image:
    name: drm-ledger-extractor
    tag: "1.0.0"
    pullPolicy: Always
  port: 3002
  # Hostname prefix - the ingress host becomes <name>.<domain>
  name: drm-ledger-extractor
  # Fabric REST API, reached in-cluster (the ingress terminates TLS and would
  # redirect plain HTTP, so the Service is used directly)
  blockchainManager: "http://fabric-rest-sample:3000/api"

# DRM Connector Monitoring
drmConnectorMonitoring:
  image:
    name: drm-connector-monitoring
    tag: "1.0.0"
    pullPolicy: Always
  port: 3001
  # Hostname prefix - the ingress host becomes <name>.<domain>
  name: drm-connector-monitoring
  blockchainManager: "http://fabric-rest-sample:3000/api"

# DRM UI Frontend (ilab-ds2-drm-user-interface)
drmUiFrontend:
  image:
    name: drm-ui-fe
    tag: "1.0.0"
    pullPolicy: Always
  # Hostname prefix - the ingress host becomes <name>.<domain>
  name: drm-ui

# Ingress configuration
ingress:
  # Leave className empty to use the cluster default ingress controller.
  # Set to "nginx" only if you have a specific named ingress class to target.
  className: "nginx"
  sslPassthrough: true
