{{- $ns := include "drm.namespace" . -}}
{{- $domain := include "drm.domain" . -}}
# ============================================================================
# DRM Ledger Extractor
# Sits between drm-ui-backend and the Fabric REST API
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drm-ledger-extractor
  namespace: {{ $ns }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drm-ledger-extractor
  template:
    metadata:
      labels:
        app: drm-ledger-extractor
    spec:
      {{- include "drm.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: main
          image: {{ include "drm.manualimageURL" (dict "ctx" $ "image" $.Values.images.drmLedgerExtractor) }}
          imagePullPolicy: {{ .Values.images.drmLedgerExtractor.pullPolicy }}
          env:
            - name: BLOCKCHAIN_MANAGER
              value: {{ .Values.drmLedgerExtractor.blockchainManager | quote }}
            - name: SAMPLE_APIKEY
              value: {{ .Values.restApi.org1ApiKey | quote }}
          ports:
            - containerPort: {{ .Values.drmLedgerExtractor.port }}

---
apiVersion: v1
kind: Service
metadata:
  name: drm-ledger-extractor
  namespace: {{ $ns }}
spec:
  ports:
    - name: http
      port: {{ .Values.drmLedgerExtractor.port }}
      protocol: TCP
  selector:
    app: drm-ledger-extractor

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: 60s
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
  labels:
    app: drm-ledger-extractor
  name: drm-ledger-extractor
  namespace: {{ $ns }}
spec:
  {{- include "drm.ingressClass" . | nindent 2 }}
  rules:
    - host: {{ .Values.drmLedgerExtractor.name }}.{{ $domain }}
      http:
        paths:
          - backend:
              service:
                name: drm-ledger-extractor
                port:
                  name: http
            path: /
            pathType: ImplementationSpecific
  # No secretName - nginx serves its default certificate for this host
  tls:
    - hosts:
        - {{ .Values.drmLedgerExtractor.name }}.{{ $domain }}
