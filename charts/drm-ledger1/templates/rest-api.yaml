{{- $ns := include "drm.namespace" . -}}
{{- $domain := include "drm.domain" . -}}
# ============================================================================
# REST API Deployment + Service + Ingress
# Waits for fabric-rest-sample-config ConfigMap (created by hook)
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-rest-sample
  namespace: {{ $ns }}
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fabric-rest-sample
  template:
    metadata:
      labels:
        app: fabric-rest-sample
    spec:
      {{- include "drm.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: main
          image: {{ include "drm.manualimageURL" (dict "ctx" $ "image" $.Values.images.restApi) }}
          imagePullPolicy: {{ .Values.images.restApi.pullPolicy }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.restApi.logLevel | quote }}
            - name: PORT
              value: {{ .Values.restApi.port | quote }}
            - name: AS_LOCAL_HOST
              value: "false"
            - name: HLF_CHANNEL_NAME
              value: {{ .Values.channel.name | quote }}
            - name: HLF_CHAINCODE_NAME
              value: {{ .Values.chaincode.name | quote }}
            - name: HLF_MSP_ID_ORG1
              value: "Org1MSP"
            - name: HLF_MSP_ID_ORG2
              value: "Org2MSP"
            - name: HLF_COMMIT_TIMEOUT
              value: {{ .Values.restApi.commitTimeout | quote }}
            - name: HLF_ENDORSE_TIMEOUT
              value: {{ .Values.restApi.endorseTimeout | quote }}
            - name: HLF_QUERY_TIMEOUT
              value: {{ .Values.restApi.queryTimeout | quote }}
            - name: ORG1_APIKEY
              value: {{ .Values.restApi.org1ApiKey | quote }}
            - name: ORG2_APIKEY
              value: {{ .Values.restApi.org2ApiKey | quote }}
            - name: REDIS_HOST
              value: "localhost"
            - name: REDIS_PORT
              value: "6379"
            - name: SUBMIT_JOB_BACKOFF_TYPE
              value: "fixed"
            - name: SUBMIT_JOB_BACKOFF_DELAY
              value: "3000"
            - name: SUBMIT_JOB_ATTEMPTS
              value: "5"
            - name: SUBMIT_JOB_CONCURRENCY
              value: "5"
            - name: SUBMIT_JOB_QUEUE_SCHEDULER
              value: "true"
            - name: MAX_COMPLETED_SUBMIT_JOBS
              value: "1000"
            - name: MAX_FAILED_SUBMIT_JOBS
              value: "1000"
          envFrom:
            - configMapRef:
                name: fabric-rest-sample-config
          ports:
            - containerPort: 3000
        - name: redis
          image: {{ include "drm.manualimageURL" (dict "ctx" $ "image" $.Values.images.redis) }}
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: fabric-rest-sample
  namespace: {{ $ns }}
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
  selector:
    app: fabric-rest-sample

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: 60s
  labels:
    app: fabric-rest-sample
  name: fabric-rest-sample
  namespace: {{ $ns }}
spec:
  {{- include "drm.ingressClass" . | nindent 2 }}
  rules:
    - host: fabric-rest-sample.{{ $domain }}
      http:
        paths:
          - backend:
              service:
                name: fabric-rest-sample
                port:
                  name: http
            path: /
            pathType: ImplementationSpecific
  # No secretName - nginx serves its default certificate for this host
  tls:
    - hosts:
        - fabric-rest-sample.{{ $domain }}
