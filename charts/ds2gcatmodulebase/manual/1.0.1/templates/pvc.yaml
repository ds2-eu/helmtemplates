{{- range $name, $c := .Values.components }}
{{- $persist := $c.persistence | default dict }}
{{- if and $c.enabled $persist.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-pvc
  namespace: {{ $.Release.Namespace }}
spec:
  storageClassName: {{ $.Release.Namespace }}-{{ $name }}-storageclass
  accessModes:
    - {{ $persist.accessmode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ $persist.storage }}
{{- end }}
{{- end }}
