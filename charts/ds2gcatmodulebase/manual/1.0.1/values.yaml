# Default values of the GCAT module base chart.
# The module chart sets module.name and, for every component, its image name and tag
# (components.<name>.image); everything else below are the defaults of each component.

module:
  name: gcat

image:
  pullPolicy: Always
  privateRegistry:
    enabled: true

# Public image of the init container that waits for the ports listed in a component's waitFor.
waitImage: busybox:1.36

serviceAccount:
  create: true

ndots:
  enabled: true

resourcesEnabled: false
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# One entry per component, keyed by the application name (which is also the
# service name and, for the frontend, the first part of its ingress host).
#   image        name and tag (the module chart sets the tag)
#   port         container port
#   waitFor      list of host and port pairs; an init container waits until each accepts connections
#   servicePort  port of the cluster service
#   config       environment variables, as a config map
#   files        files stored in a config map
#   fileMounts   mount files from that config map: key, mountPath
#   persistence  host path volume: enabled, storage, path, mountpath, accessmode, reclaimpolicy
#   ingress      enabled, host (default <name>.<idt domain>), annotations, path, pathType, tlsSecretName
components:
  gcatnats:
    enabled: true
    image:
      name: gcat-nats
      tag: ""
    port: 4222
    servicePort: 4222

  gcatfuseki:
    enabled: true
    image:
      name: gcat-fuseki
      tag: ""
    port: 3030
    servicePort: 3030
    config:
      FUSEKI_ARGS: --update
    persistence:
      enabled: true
      storage: 5Gi
      path: /idt/gcat/gcatfuseki
      mountpath: /fuseki/databases
      accessmode: ReadWriteOnce
      reclaimpolicy: Delete

  gcatapigateway:
    enabled: true
    image:
      name: gcat-api-gateway
      tag: ""
    port: 3000
    servicePort: 3000
    waitFor:
      - { host: gcatnats, port: 4222 }
    config:
      NODE_ENV: production
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "3000"
      ALLOW_PUBLIC_POLICY_READ: "true"
      MOLECULER_TRANSPORTER: nats://gcatnats:4222
      MOLECULER_LOGGER: "false"
      MOLECULER_LOG_LEVEL: warn
      MOLECULER_METRICS: "false"
      MOLECULER_TRACING: "false"

  gcatidentityservice:
    enabled: true
    image:
      name: gcat-identity-service
      tag: ""
    port: 3000
    servicePort: 3000
    waitFor:
      - { host: gcatnats, port: 4222 }
    config:
      NODE_ENV: production
      KEYCLOAK_URI: https://keycloak.ds2.icelab.cloud
      KEYCLOAK_REALM: ds2
      IDM_SIGN_URL: https://idm.ds2.icelab.cloud/idm-api/credentials/sign
      REPOSITORY_INSERT_URL: https://repository.ds2.icelab.cloud/repository-api/insert
      ACQUISITION_DEFAULT_ORGANIZATION_DID: ""
      ACQUISITION_DEFAULT_OWNER_ID: dsa1
      ACQUISITION_DEFAULT_DATASPACE_ID: ""
      ACQUISITION_DEFAULT_CREDENTIAL_TYPE: AcquisitionCredential
      MOLECULER_TRANSPORTER: nats://gcatnats:4222
      MOLECULER_LOGGER: "false"
      MOLECULER_LOG_LEVEL: info
      MOLECULER_METRICS: "false"
      MOLECULER_TRACING: "false"

  gcatcatalogservice:
    enabled: true
    image:
      name: gcat-catalog-service
      tag: ""
    port: 3000
    servicePort: 3000
    waitFor:
      - { host: gcatnats, port: 4222 }
      - { host: gcatfuseki, port: 3030 }
    config:
      NODE_ENV: production
      MOLECULER_TRANSPORTER: nats://gcatnats:4222
      MOLECULER_LOGGER: "false"
      MOLECULER_LOG_LEVEL: info
      MOLECULER_METRICS: "false"
      MOLECULER_TRACING: "false"
      CATALOG_BACKEND: fuseki
      FUSEKI_ENABLED: "true"
      FUSEKI_SYNC_ENABLED: "false"
      FUSEKI_PROTOCOL: http
      FUSEKI_HOST: gcatfuseki
      FUSEKI_PORT: "3030"
      FUSEKI_BASE_URL: http://gcatfuseki:3030
      FUSEKI_DATASET: cat-data
      FUSEKI_GRAPH_DCAT: urn:cat:dcat
      FUSEKI_GRAPH_META: urn:cat:meta
      FUSEKI_TIMEOUT_MS: "30000"
      FUSEKI_TLS_REJECT_UNAUTHORIZED: "true"

  gcatedcconnectorservice:
    enabled: true
    image:
      name: gcat-edc-connector-service
      tag: ""
    port: 3000
    servicePort: 3000
    waitFor:
      - { host: gcatnats, port: 4222 }
    config:
      NODE_ENV: production
      MOLECULER_TRANSPORTER: nats://gcatnats:4222
      MOLECULER_LOGGER: "false"
      MOLECULER_LOG_LEVEL: info
      MOLECULER_METRICS: "false"
      MOLECULER_TRACING: "false"
    fileMounts:
      - key: connectors.yaml
        mountPath: /app/connectors.yaml
    files:
      connectors.yaml: |
        connectors:
          city-scape:
            participantId: city-scape-participant
            connectorGatewayBaseUrl: https://dataops.collab-cloud.eu:8443
            interfaces:
              management: { port: 39193, path: /management }
              protocol: { port: 39194, path: /protocol }
          green-deal:
            participantId: green-deal-participant
            connectorGatewayBaseUrl: https://dataops.collab-cloud.eu:8443
            interfaces:
              management: { port: 19193, path: /management }
              protocol: { port: 19194, path: /protocol }
          precision-agriculture:
            participantId: precision-agriculture-participant
            connectorGatewayBaseUrl: https://dataops.collab-cloud.eu:8443
            interfaces:
              management: { port: 49193, path: /management }
              protocol: { port: 49194, path: /protocol }
          example:
            participantId: example-participant
            connectorGatewayBaseUrl: https://dataops.collab-cloud.eu:8443
            interfaces:
              management: { port: 59193, path: /management }
              protocol: { port: 59194, path: /protocol }

  # Frontend (nginx): the only component with an ingress, serving the UI at / and the API at /api.
  gcat:
    enabled: true
    image:
      name: gcat-nginx
      tag: ""
    port: 8080
    servicePort: 80
    ingress:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
    config:
      NGINX_MODE: http
      NGINX_ENABLE_ASSETS: "false"
      NGINX_API_UPSTREAM: http://gcatapigateway:3000
    fileMounts:
      - key: app-config.js
        mountPath: /usr/share/nginx/html/ui/app-config.js
    files:
      app-config.js: |
        window.__APP_CONFIG__ = {
          API_BASE: '/api',
          DASH_AUTH: {
            ENABLED: 'true',
            PORTAL_API_URL: 'https://portal-api.ds2.icelab.cloud',
            AUTH_METHOD: 'login-required',
            SHOW_POST_LOGIN_TEXT: 'false'
          }
        };
